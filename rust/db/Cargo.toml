[package]
name = "cine-rec-db"
version = "0.1.0"
edition = "2021"
description = "Rust port of cine-rec-engine's DB layer - schema registry, dynamic SQL, recall channels"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "json",
] }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lib]
name = "cine_rec_db"
