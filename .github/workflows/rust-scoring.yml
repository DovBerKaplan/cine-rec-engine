name: rust-scoring

# The compiled scoring extension: build it and run the bridge/differential
# tests against it. Without this job the extension-dependent tests
# (tests/test_scoring_rs_bridge.py, incl. the differential fuzz) skip
# everywhere — the pure wheel must keep passing WITHOUT the extension,
# and this job proves the accelerated path in the same commit.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the extension installs only on >= 3.12 (sum() semantics)
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
      - name: Build extension
        run: cargo build --release --features pyo3 --manifest-path rust/scoring/Cargo.toml
      - name: Install package
        run: pip install -e ".[dev,serve]"
      - name: Place extension
        run: cp rust/scoring/target/release/libcine_rec_scoring.so cine_rec_engine/_scoring_rs.so
      - name: Rust unit + parity tests
        run: cargo test --manifest-path rust/scoring/Cargo.toml
      - name: Bridge + full suite (Rust active)
        run: pytest -q
      - name: Full suite (forced pure)
        run: pytest -q
        env:
          CINE_REC_SCORING_RS: "0"

  db-live-parity:
    # The rust/db integration + FIELD-LEVEL Python-parity tests need a
    # seeded demo Postgres — without a DSN they early-return "ok" and
    # prove nothing (the phase-3 review's M-6).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CINE_REC_INTEGRATION_DSN: postgresql://demo:demo@127.0.0.1:5432/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
      - name: Schema + demo data
        run: |
          pip install asyncpg loguru
          python - <<'PY'
          import asyncio, asyncpg, os, subprocess
          DSN = os.environ["CINE_REC_INTEGRATION_DSN"]
          async def main():
              c = await asyncpg.connect(DSN)
              await c.execute("CREATE EXTENSION IF NOT EXISTS vector")
              await c.execute(open("docs/schema.sql").read())
              await c.execute(open("docs/user_data.sql").read())
              await c.close()
          asyncio.run(main())
          PY
          DUMMY=1 python demo/seed.py
        env:
          DATABASE_URL: postgresql://demo:demo@127.0.0.1:5432/demo
      - name: Regenerate parity fixture from Python
        run: |
          pip install -e . --no-deps
          python rust/db/tests/fixtures/gen_live_parity.py
      - name: db tests (unit + integration + live parity)
        run: cargo test --manifest-path rust/db/Cargo.toml
