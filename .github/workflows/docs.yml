name: docs

# Build the mkdocs-material site and publish it to the gh-pages branch
# (the repo's Pages source). The static browser demo rides along under
# /demo/ — copied from demo/site after the build; it is fully
# precomputed and makes no API calls.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "demo/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build site (demo preserved under /demo/)
        run: |
          mkdocs build --strict
          mkdir -p site/demo
          cp demo/site/index.html site/demo/index.html
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # single-purpose branch — replace, don't accumulate history
          force_orphan: true
          commit_message: "docs site (mkdocs + /demo/) [skip ci]"
