name: docs

# Build the mkdocs-material site and deploy via the official Pages
# Actions flow. The static browser demo rides along under /demo/
# (copied from demo/site after the build — it is fully precomputed and
# makes no API calls).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "demo/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build site
        run: mkdocs build --strict
      - name: Preserve the static demo under /demo/
        run: |
          mkdir -p site/demo
          cp demo/site/index.html site/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
